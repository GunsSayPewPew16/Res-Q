<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Res-Q | Recipient Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#0c0c0c',
                        cardbg: '#141414',
                        cardhover: '#1c1c1c',
                        accent: '#ff4500',
                        cream: '#f4f4f0',
                        muted: '#888888'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom notched corners to mimic the Apptronik reference style */
        .notched-card {
            background-color: #141414;
            border-radius: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
            clip-path: polygon(
                0 0, 
                calc(100% - 35px) 0, 
                100% 35px, 
                100% 100%, 
                0 100%
            );
        }
        .notched-card:hover {
            background-color: #1c1c1c;
            transform: translateY(-4px);
        }

        /* Inverse notch variant */
        .notched-card-alt {
            background-color: #141414;
            border-radius: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
            clip-path: polygon(
                35px 0, 
                100% 0, 
                100% 100%, 
                0 100%, 
                0 35px
            );
        }
        .notched-card-alt:hover {
            background-color: #1c1c1c;
            transform: translateY(-4px);
        }

        /* Orange accent CTA card with notch */
        .notched-orange {
            background-color: #ff4500;
            border-radius: 1.5rem;
            clip-path: polygon(
                0 0, 
                100% 0, 
                100% calc(100% - 35px), 
                calc(100% - 35px) 100%, 
                0 100%
            );
        }

        /* Custom scrollbar for the long rails */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff4500;
        }
    </style>
</head>
<body class="bg-[#0c0c0c] text-[#f4f4f0] font-sans antialiased selection:bg-[#ff4500] selection:text-white min-h-screen flex flex-col">

    <!-- RECIPIENT DASHBOARD: the layout skeleton. Every box is kept as a box; none of
         them carry copy, so this is the arrangement alone. -->

    <header class="sticky top-0 z-50 bg-[#0c0c0c]/90 backdrop-blur-md border-b border-neutral-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="brand-home flex items-center space-x-3">
                <span class="text-xs font-mono text-neutral-500">SYS.01 //</span>
                <span class="text-2xl font-black tracking-tighter uppercase">Res-<span class="text-[#ff4500]">Q</span></span>
                <span class="hidden xl:inline text-xs font-mono text-neutral-400 ml-2">// RECIPIENT INTAKE &amp; DELIVERY</span>
            </a>
            <div class="flex items-center space-x-3">
                <button type="button" onclick="triggerNotification()" aria-label="System notifications" class="p-2.5 rounded-xl bg-[#141414] border border-neutral-800 text-neutral-400 hover:text-white hover:border-neutral-700 transition-all relative">
                    <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-[#ff4500]"></span>
                    <span aria-hidden="true">🔔</span>
                </button>
                <div class="flex items-center space-x-3 bg-[#141414] border border-neutral-800 rounded-full px-4 py-1.5">
                    <div id="userInitials" class="w-7 h-7 rounded-full bg-[#ff4500] flex items-center justify-center font-bold text-xs text-black font-mono">R</div>
                    <span id="userName" class="text-xs font-mono text-neutral-300 hidden md:inline">SIGNED IN</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-10">

        <!-- Dashboard grid: slim navigation rail on the left, working area on the right -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

            <!-- Left rail: navigation slots, a registration slot and the pipeline status;
                 the rows and panels stay, their contents are gone. -->
            <aside class="lg:col-span-2 bg-[#141414] border border-neutral-800 rounded-3xl p-5 flex flex-col justify-between lg:min-h-[520px]">
                <nav class="space-y-2" aria-label="Dashboard sections">
                    <a href="#" onclick="setActiveNav(this); return false;" class="nav-item block h-11 rounded-xl bg-neutral-900 border border-neutral-800 transition-all"></a>
                    <a href="#" onclick="setActiveNav(this); return false;" class="nav-item block h-11 rounded-xl border border-transparent hover:bg-neutral-900/50 transition-all"></a>
                    <a href="#" onclick="setActiveNav(this); return false;" class="nav-item block h-11 rounded-xl border border-transparent hover:bg-neutral-900/50 transition-all"></a>
                    <a href="#" onclick="setActiveNav(this); return false;" class="nav-item block h-11 rounded-xl border border-transparent hover:bg-neutral-900/50 transition-all"></a>
                </nav>

                <div class="pt-5 mt-5 border-t border-neutral-800 space-y-3">
                    <div class="p-3 bg-neutral-900 rounded-2xl border border-neutral-800 min-h-[58px]"></div>
                    <div class="p-3 bg-neutral-900 rounded-2xl border border-neutral-800 flex items-center min-h-[58px]">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    </div>
                </div>
            </aside>

            <!-- Working area -->
            <div class="lg:col-span-10 space-y-6">

                <!-- Metric row -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="notched-card p-6 flex flex-col justify-between h-40">
                        <span class="self-start block h-6 w-20 rounded-full bg-orange-950/50 border border-orange-900/50"></span>
                    </div>

                    <div class="notched-card p-6 flex flex-col justify-between h-40">
                        <span class="self-start block h-6 w-20 rounded-full bg-emerald-950/50 border border-emerald-900/50"></span>
                    </div>

                    <div class="notched-orange p-6 flex flex-col justify-between h-40 text-black">
                        <span class="self-start block h-6 w-20 rounded-full bg-black/20"></span>
                    </div>
                </div>

                <!-- Map + intake request box, then the queue rail -->
                <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">

                    <div class="xl:col-span-8 space-y-6">

                        <!-- Routing map panel -->
                        <div class="bg-[#141414] border border-neutral-800 rounded-3xl p-6 relative overflow-hidden">
                            <div class="w-full h-72 rounded-2xl border border-neutral-800 bg-[#0c0c0c]"></div>
                        </div>

                        <!-- Quick intake request panel -->
                        <div class="bg-[#141414] border border-neutral-800 rounded-3xl p-6 relative">
                            <div class="border-b border-neutral-800 pb-4 mb-6"></div>
                            <div class="min-h-[240px]"></div>
                        </div>

                    </div>

                    <!-- Queue rail -->
                    <div class="xl:col-span-4 space-y-6">

                        <div class="bg-[#141414] border border-neutral-800 rounded-3xl p-6 relative overflow-hidden">
                            <div class="flex items-center justify-between pb-4 mb-6 border-b border-neutral-800">
                                <span class="w-3 h-3 rounded-full bg-[#ff4500]"></span>
                            </div>

                            <div class="space-y-4">
                                <div class="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 hover:border-neutral-700 transition-all h-[72px]">
                                    <span class="block h-4 w-20 rounded-full border border-emerald-900/50 bg-emerald-950/60"></span>
                                </div>
                                <div class="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 hover:border-neutral-700 transition-all h-[72px]">
                                    <span class="block h-4 w-20 rounded-full border border-orange-900/50 bg-orange-950/60"></span>
                                </div>
                                <div class="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 hover:border-neutral-700 transition-all h-[72px]">
                                    <span class="block h-4 w-20 rounded-full border border-neutral-700 bg-neutral-800"></span>
                                </div>
                            </div>
                        </div>

                        <div class="notched-card-alt p-6 border border-neutral-800">
                            <div class="space-y-3">
                                <div class="bg-neutral-900 p-3 rounded-xl border border-neutral-800 h-[44px]"></div>
                                <div class="bg-neutral-900 p-3 rounded-xl border border-neutral-800 h-[44px]"></div>
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer class="max-w-7xl mx-auto px-6 pb-10 w-full">
        <div class="border-t border-neutral-800 pt-6 font-mono text-[10px] text-neutral-600">RES-Q PLATFORM — AI FOR COMMUNITY SERVICES — RECIPIENT</div>
    </footer>

    <script>
        // ---------------------------------------------------------------------------
        // Session: the dashboard is private. THIS_PAGE is the dashboard this file
        // represents, and dashboardBoot() keeps the brand lockup pointed at the
        // signed-in user's own dashboard, sending anyone who lands on the wrong one
        // to the dashboard that matches their account role.
        // ---------------------------------------------------------------------------
        var THIS_PAGE = 'recipient';
        var DASHBOARDS = {
            donor: 'res_q_dashboard_donor.html',
            recipient: 'res_q_dashboard_recipient.html'
        };
        var TOKEN_KEY = 'resqToken';
        var ROLE_KEY = 'resqRole';

        function dashboardFor(role) {
            return DASHBOARDS[role] || '';
        }
        function readStore(key) {
            try { return window.localStorage.getItem(key) || ''; } catch (err) { return ''; }
        }
        function writeStore(key, value) {
            try { window.localStorage.setItem(key, value); } catch (err) { /* storage blocked */ }
        }
        function dropStore(key) {
            try { window.localStorage.removeItem(key); } catch (err) { /* storage blocked */ }
        }

        function initialsOf(name) {
            var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
            if (!parts.length) { return 'R'; }
            var first = parts[0].charAt(0);
            var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
            return (first + last).toUpperCase();
        }

        // The header is site chrome and stays: it only names the signed-in account.
        function renderUser(user) {
            var name = user.business_name
                || [user.first_name, user.last_name].filter(Boolean).join(' ')
                || 'Res-Q Account';
            document.getElementById('userName').textContent = name;
            document.getElementById('userInitials').textContent = initialsOf(name);
        }

        (function dashboardBoot() {
            var links = document.querySelectorAll('.brand-home');
            function setHome(href) {
                Array.prototype.forEach.call(links, function (link) {
                    link.setAttribute('href', href);
                });
            }

            var token = readStore(TOKEN_KEY);
            var cachedRole = readStore(ROLE_KEY);

            // Trust the stored session first so the click lands instantly...
            setHome(token ? (dashboardFor(cachedRole) || 'index.html') : 'index.html');

            // ...a dashboard is private, so a visitor with no token starts over.
            if (!token) {
                window.location.replace('index.html');
                return;
            }

            // ...then let the backend settle the link, the header and which dashboard this is.
            fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } })
                .then(function (response) {
                    return response.json().catch(function () { return {}; }).then(function (data) {
                        return { status: response.status, data: data };
                    });
                })
                .then(function (res) {
                    if (res.status !== 200) {
                        dropStore(TOKEN_KEY);
                        dropStore(ROLE_KEY);
                        setHome('index.html');
                        window.location.replace('index.html');
                        return;
                    }
                    var user = res.data.user || {};
                    var role = user.role || '';
                    writeStore(ROLE_KEY, role);
                    setHome(dashboardFor(role) || 'index.html');
                    renderUser(user);
                    if (role && role !== THIS_PAGE) {
                        window.location.replace(dashboardFor(role));
                    }
                })
                .catch(function () { /* offline: leave the cached links in place */ });
        })();

        // ---------------------------------------------------------------------------
        // Navigation rail: the rows are kept, so the active-row highlight still works.
        // ---------------------------------------------------------------------------
        function setActiveNav(element) {
            document.querySelectorAll('.nav-item').forEach(function (item) {
                item.classList.remove('bg-neutral-900', 'border-neutral-800');
                item.classList.add('border-transparent');
            });
            element.classList.add('bg-neutral-900', 'border-neutral-800');
            element.classList.remove('border-transparent');
        }

        function triggerNotification() {
            alert('Res-Q System: All nodes operating at peak efficiency. 2 donors matched to your requests.');
        }
    </script>
</body>
</html>
